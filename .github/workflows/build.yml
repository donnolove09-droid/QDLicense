name: Build dylib
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
      - name: Build
        run: make FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: QDLicense-dylib
          if-no-files-found: warn
          path: |
            .theos/obj/QDLicense.dylib
            .theos/obj/debug/QDLicense.dylib
